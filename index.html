<!DOCTYPE html><html><body style="font-family:sans-serif;max-width:480px;margin:auto;padding:10px">
<h3>Tote Logger</h3>
<select id="tote" style="width:100%;font-size:18px"></select>
<div style="margin:6px 0">
  <input id="newTote" placeholder="New tote ID" style="font-size:16px">
  <button onclick="addT()">Add</button>
  <button onclick="detach()" style="float:right;background:#c33;color:#fff">Detach tote</button>
</div>
<input id="wid" placeholder="Scan WID" style="width:100%;font-size:20px;margin:4px 0" autofocus>
<input id="loc" placeholder="Scan Location" style="width:100%;font-size:20px;margin:4px 0">
<div>Scanned: <b id="cnt">0</b> | Pending: <b id="pend">0</b></div>
<div id="list" style="font-size:14px"></div>
<script>
const $=id=>document.getElementById(id);
let q=[], busy=false, cnt={};
function loadTotes(sel){google.script.run.withSuccessHandler(t=>{
  $('tote').innerHTML=t.map(x=>`<option>${x}</option>`).join('');
  if(sel)$('tote').value=sel; upd();}).getTotes();}
function addT(){const v=$('newTote').value.trim(); if(!v)return;
  google.script.run.withSuccessHandler(id=>{$('newTote').value='';loadTotes(id);$('wid').focus();}).addTote(v);}
function upd(){$('cnt').textContent=cnt[$('tote').value]||0;$('pend').textContent=q.length+(busy?1:0);}
$('tote').onchange=()=>{upd();$('wid').focus();};
$('wid').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('wid').value.trim())$('loc').focus();});
$('loc').addEventListener('keydown',e=>{if(e.key!=='Enter')return;
  const t=$('tote').value,w=$('wid').value.trim(),l=$('loc').value.trim();
  if(!t||!w||!l)return;
  const row=document.createElement('div');row.textContent=`… ${w} → ${l}`;$('list').prepend(row);
  q.push({t,w,l,row});cnt[t]=(cnt[t]||0)+1;
  $('wid').value='';$('loc').value='';$('wid').focus();upd();run();});   // instant clear, background send
function run(){ if(busy||!q.length)return; busy=true; const it=q[0];
  google.script.run.withSuccessHandler(r=>{q.shift();busy=false;
    it.row.textContent=`✓ ${it.w} → ${it.l}${r.dup?' (qty '+r.qty+')':''}`;upd();run();})
  .withFailureHandler(()=>{busy=false;it.row.textContent=`✗ retrying ${it.w}`;setTimeout(run,2000);})
  .logWid(it.t,it.w,it.l);}
function detach(){const t=$('tote').value; if(!t||q.length||busy)return alert('Wait for pending to finish');
  if(!confirm('Detach '+t+'?'))return;
  google.script.run.withSuccessHandler(()=>loadTotes()).detachTote(t);}
window.onbeforeunload=()=>q.length?'Pending':undefined;
loadTotes();
</script></body></html>
