<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:#f1f3f6;color:#212121}
header{background:#2874f0;color:#fff;padding:14px 16px;font-size:20px;font-weight:600;position:sticky;top:0;z-index:5;box-shadow:0 2px 4px rgba(0,0,0,.2)}
header i{color:#ffe500;font-size:13px;font-weight:400;margin-left:6px}
main{max-width:480px;margin:auto;padding:12px}
.steps{display:flex;justify-content:space-between;background:#fff;border-radius:4px;padding:10px 6px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.st{flex:1;text-align:center;font-size:12px;color:#878787}
.st .n{width:26px;height:26px;border-radius:50%;background:#e0e0e0;color:#fff;margin:0 auto 4px;line-height:26px;font-size:14px;font-weight:600}
.st.act{color:#2874f0;font-weight:600}.st.act .n{background:#2874f0}
.st.done{color:#388e3c}.st.done .n{background:#388e3c}
.card{background:#fff;border-radius:4px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.12);border-left:4px solid #e0e0e0}
.card.act{border-left-color:#2874f0}
.card.ok{border-left-color:#388e3c}
.ct{font-size:13px;font-weight:600;color:#2874f0;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.cs{font-size:12px;color:#878787;margin-bottom:8px}
input{width:100%;font-size:18px;padding:10px;border:1px solid #c2c2c2;border-radius:2px;outline:none}
input:focus{border-color:#2874f0;box-shadow:0 0 0 2px rgba(40,116,240,.2)}
button{border:0;border-radius:2px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.pri{background:#2874f0;color:#fff}
.locked{font-size:20px;font-weight:600;color:#388e3c}
.sum{display:flex;gap:8px;margin-bottom:12px}
.sum div{flex:1;background:#e8f0fe;border-radius:4px;padding:8px 10px;font-size:12px;color:#555}
.sum b{display:block;font-size:17px;color:#2874f0}
.seg{display:flex;gap:8px;margin-top:12px}
.seg button{margin:0;background:#fff;color:#2874f0;border:1px solid #2874f0;font-size:13px}
.seg button.on{background:#2874f0;color:#fff}
.seg button.d{color:#d32f2f;border-color:#d32f2f}
.seg button.d.on{background:#d32f2f;color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:15px;word-break:break-all}
.item span{background:#e8f0fe;color:#2874f0;border-radius:10px;padding:2px 10px;margin-right:8px;font-size:13px}
.item a{color:#d32f2f;font-size:20px;cursor:pointer;padding:0 4px}
.h{padding:6px 0;border-bottom:1px solid #eee;font-size:13px}
.empty{color:#878787;font-size:13px;padding:8px 0}
</style></head><body>
<header>Tote Logger<i>Explore Plus</i></header>
<main>
<div class="steps">
  <div class="st" id="st1"><div class="n">1</div>Tote</div>
  <div class="st" id="st2"><div class="n">2</div>Location</div>
  <div class="st" id="st3"><div class="n">3</div>WIDs</div>
</div>

<div id="vSetup">
  <div class="card" id="c1">
    <div class="ct">Step 1 · Scan tote</div>
    <div class="cs">Scan the tote ID label</div>
    <input id="toteIn" placeholder="Tote ID">
    <div id="toteLock" class="locked" style="display:none"></div>
  </div>
  <div class="card" id="c2">
    <div class="ct">Step 2 · Scan location</div>
    <div class="cs">Scan the bin / shelf label where this tote is placed</div>
    <input id="locIn" placeholder="Location ID">
  </div>
  <button class="pri" onclick="start()" style="margin-bottom:12px">NEXT · SCAN WIDs</button>
  <div class="card"><div class="ct">Recent · Pending <b id="pend">0</b></div><div id="hist"><div class="empty">No submissions yet</div></div></div>
</div>

<div id="vScan" style="display:none">
  <div class="sum">
    <div>Tote<b id="sTote"></b></div>
    <div>Location<b id="sLoc"></b></div>
  </div>
  <div class="card act">
    <div class="ct">Step 3 · Scan WIDs <span id="cnt" style="float:right;text-transform:none">0 scanned</span></div>
    <div class="cs">Scan each WID placed in this tote</div>
    <input id="wid" placeholder="WID">
    <div id="list" style="margin-top:8px"></div>
    <div class="seg">
      <button id="bSame" class="on" onclick="setMode('same')">SAME TOTE<br>NEW LOCATION</button>
      <button id="bDet" class="d" onclick="setMode('detach')">DETACH<br>TOTE</button>
    </div>
    <button class="pri" onclick="submitB()" style="margin-top:12px">SUBMIT</button>
  </div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let tote=null,loc=null,items=[],mode='same',q=[],busy=false;

function stepper(n){
  for(let i=1;i<=3;i++){const e=$('st'+i);
    e.className='st'+(i<n?' done':i===n?' act':'');
    e.firstChild.textContent=i<n?'✓':i;}
  $('c1').className='card'+(n===1?' act':n>1?' ok':'');
  $('c2').className='card'+(n===2?' act':'');
}
function view(v){$('vSetup').style.display=v==='s'?'block':'none';$('vScan').style.display=v==='c'?'block':'none';}

function showSetup(){
  view('s');
  $('toteIn').style.display=tote?'none':'block';
  $('toteLock').style.display=tote?'block':'none';
  $('toteLock').textContent=tote?'✓ '+tote+' (same tote)':'';
  $('locIn').value='';
  stepper(tote?2:1);
  (tote?$('locIn'):$('toteIn')).focus();
}
function start(){
  const t=tote||$('toteIn').value.trim(), l=$('locIn').value.trim();
  if(!t){stepper(1);$('toteIn').focus();return;}
  if(!l){stepper(2);$('locIn').focus();return;}
  tote=t;loc=l;items=[];$('toteIn').value='';
  $('sTote').textContent=tote;$('sLoc').textContent=loc;
  render();view('c');stepper(3);$('wid').focus();
}
function addWid(){
  const w=$('wid').value.trim();if(!w)return;
  const it=items.find(x=>x.w===w);
  if(it){it.q++;items=[it].concat(items.filter(x=>x!==it));}else items.unshift({w:w,q:1});
  $('wid').value='';render();
}
function rm(w){items=items.filter(x=>x.w!==w);render();$('wid').focus();}
function render(){
  const L=$('list');L.innerHTML='';
  if(!items.length)L.innerHTML='<div class="empty">No WIDs scanned yet</div>';
  items.forEach(it=>{
    const d=document.createElement('div');d.className='item';
    const a=document.createElement('div');a.textContent=it.w;
    const m=document.createElement('div');
    const s=document.createElement('span');s.textContent='×'+it.q;
    const x=document.createElement('a');x.textContent='×';x.onclick=()=>rm(it.w);
    m.append(s,x);d.append(a,m);L.append(d);
  });
  $('cnt').textContent=items.reduce((a,b)=>a+b.q,0)+' scanned';
}
function setMode(m){mode=m;
  $('bSame').classList.toggle('on',m==='same');
  $('bDet').classList.toggle('on',m==='detach');}
function submitB(){
  if(!items.length){$('wid').focus();return;}
  const detach=mode==='detach',total=items.reduce((a,b)=>a+b.q,0);
  const row=document.createElement('div');row.className='h';
  row.textContent='… '+tote+' @ '+loc+' · '+total+' WIDs';
  const H=$('hist');if(H.querySelector('.empty'))H.innerHTML='';H.prepend(row);
  q.push({t:tote,l:loc,items:items,d:detach,row:row,total:total});
  items=[];if(detach)tote=null;
  setMode('same');loc=null;
  showSetup();upd();run();
}
function upd(){$('pend').textContent=q.length;}
function run(){
  if(busy||!q.length)return;busy=true;const b=q[0];
  google.script.run
    .withSuccessHandler(()=>{q.shift();busy=false;
      b.row.textContent='✓ '+b.t+' @ '+b.l+' · '+b.total+' WIDs'+(b.d?' · detached':'');upd();run();})
    .withFailureHandler(()=>{busy=false;b.row.textContent='✗ retrying '+b.t+'…';setTimeout(run,2000);})
    .logBatch(b.t,b.l,b.items,b.d);
}
$('toteIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('toteIn').value.trim()){stepper(2);$('locIn').focus();}});
$('locIn').addEventListener('keydown',e=>{if(e.key==='Enter')start();});
$('wid').addEventListener('keydown',e=>{if(e.key==='Enter')addWid();});
window.onbeforeunload=()=>q.length?'Pending':undefined;
showSetup();
</script></body></html>
