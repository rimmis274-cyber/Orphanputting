<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tote Logger</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:#f1f3f6;color:#212121}
header{background:#2874f0;color:#fff;padding:14px 16px;font-size:20px;font-weight:600;position:sticky;top:0;z-index:5;box-shadow:0 2px 4px rgba(0,0,0,.2)}
header i{color:#ffe500;font-size:13px;font-weight:400;margin-left:6px}
header small{float:right;font-size:11px;font-weight:400;opacity:.8;margin-top:6px}
main{max-width:480px;margin:auto;padding:12px}
#banner{display:none;background:#fdecea;color:#b71c1c;border-left:4px solid #d32f2f;border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:13px;word-break:break-word}
<header>Tote Logger<i>Explore Plus</i><small id="ver"></small></header>
<main>
<div id="banner"></div>
const API='https://script.google.com/macros/s/AKfycbykdNT3mWYI1-AvczL6mlkTFCUXQR6wEgmyK7-ml6itAOo0dJ06AHysfqLV08qAZR3vTA/exec';   // https://script.google.com/macros/s/.../exec

const $=id=>document.getElementById(id);
let tote=null,loc=null,items=[],mode='same',q=[],busy=false;

function banner(m){const b=$('banner');b.style.display=m?'block':'none';b.textContent=m||'';}

fetch(API).then(r=>r.json())
  .then(r=>{if(r.ok){$('ver').textContent=r.version;banner('');}else banner('Backend error: '+r.error);})
  .catch(()=>banner('Cannot reach backend. Check API URL, and deploy access = Anyone.'));
  q.push({t:tote,l:loc,items:items,d:detach,row:row,total:total,tries:0});
  items=[];if(detach)tote=null;
  setMode('same');loc=null;
  showSetup();upd();run();
}
function upd(){$('pend').textContent=q.length;}
function fail(b,msg){
  busy=false;b.tries++;b.row.className='h err';
  if(b.tries<3){b.row.textContent='✗ '+msg+' · retrying '+b.tries+'/3';setTimeout(run,2000);}
  else{b.row.textContent='✗ '+msg+' · TAP TO RETRY';b.row.style.cursor='pointer';
    b.row.onclick=()=>{b.tries=0;b.row.onclick=null;b.row.style.cursor='';run();};}
}
function run(){
  if(busy||!q.length)return;busy=true;const b=q[0];
  fetch(API,{method:'POST',body:JSON.stringify({tote:b.t,loc:b.l,items:b.items,detach:b.d})})
    .then(r=>r.json())
    .then(r=>{
      if(r&&r.ok){q.shift();busy=false;b.row.className='h';
        b.row.textContent='✓ '+b.t+' @ '+b.l+' · '+b.total+' WIDs'+(b.d?' · detached':'');upd();run();}
      else fail(b,(r&&r.error)||'Bad response');})
    .catch(e=>fail(b,'Network/CORS: '+e.message));
}
$('toteIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('toteIn').value.trim()){stepper(2);$('locIn').focus();}});
$('locIn').addEventListener('keydown',e=>{if(e.key==='Enter')start();});
$('wid').addEventListener('keydown',e=>{if(e.key==='Enter')addWid();});
window.onbeforeunload=()=>q.length?'Pending':undefined;
showSetup();
</script></body></html>
